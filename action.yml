name: "IAM Sentinel Guardrails"
description: "Fail the build on IAM privilege-escalation in policies or Terraform plans (AWS/Azure/GCP). Air-gapped, deterministic."
author: "IAM Sentinel"
branding:
  icon: "shield"
  color: "purple"

inputs:
  tfplan:
    description: "Path to `terraform show -json` output (extract IAM from a Terraform plan)."
    required: false
    default: ""
  paths:
    description: "Space-separated policy JSON files, globs, or directories to scan."
    required: false
    default: ""
  fail-on:
    description: "Minimum severity that fails the build: CRITICAL | HIGH | MEDIUM | LOW | INFO."
    required: false
    default: "HIGH"
  output:
    description: "SARIF output file (upload it with github/codeql-action/upload-sarif)."
    required: false
    default: "iam-sentinel.sarif"
  comment-file:
    description: "Path to output Markdown PR comment summary table."
    required: false
    default: "iam-sentinel-comment.md"

outputs:
  sarif:
    description: "Path to the generated SARIF file."
    value: ${{ inputs.output }}
  comment-file:
    description: "Path to the generated Markdown PR comment file."
    value: ${{ inputs.comment-file }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run IAM Sentinel guardrails
      shell: bash
      run: |
        set +e
        args=""
        [ -n "${{ inputs.tfplan }}" ] && args="$args --tfplan ${{ inputs.tfplan }}"
        [ -n "${{ inputs.paths }}" ] && args="$args ${{ inputs.paths }}"
        # SARIF file for GitHub Code Scanning annotations...
        python "${{ github.action_path }}/guardrails.py" $args --fail-on "${{ inputs.fail-on }}" --format sarif > "${{ inputs.output }}"
        code=$?
        # Markdown summary table for PR comments and GitHub Job Summary...
        python "${{ github.action_path }}/guardrails.py" $args --fail-on "${{ inputs.fail-on }}" --comment-file "${{ inputs.comment-file }}" --format text || true
        exit $code
